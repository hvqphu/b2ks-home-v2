name: Deploy B2KS Daily Routines to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build Vite + PWA
        run: npm run build
      - name: Support legacy /docs/ URL redirect
        run: |
          mkdir -p dist/docs
          cat << 'EOF' > dist/docs/index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <title>B2KS Daily Routines</title>
            <meta http-equiv="refresh" content="0; url=../">
          </head>
          <body>
            <script>
              (function () {
                var go = function () {
                  window.location.replace('../' + window.location.search + window.location.hash);
                };
                if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
                  navigator.serviceWorker.getRegistrations()
                    .then(function (regs) {
                      return Promise.all(regs.map(function (r) {
                        return r.scope && r.scope.indexOf('/docs') !== -1 ? r.unregister() : Promise.resolve(false);
                      }));
                    })
                    .catch(function () {})
                    .finally(go);
                } else {
                  go();
                }
              })();
            </script>
          </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
